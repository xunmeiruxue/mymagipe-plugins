# Publishes every package under mcp/* and plugins/* whose version npm
# doesn't have yet: bump a package's version and merge, and it goes out.
#
# Packages already on npm publish by OIDC: bind each one with
#   npm trust github <pkg> --file publish.yml --repo …, --allow-publish
# and no token is involved. A package npm has never seen still needs a token
# to stage its first version: set the repository variable NPM_AUTH to "op"
# for that run, and the workflow reads the token from a 1Password Environment.
name: publish

on:
  push:
    branches: [main, master]
    paths:
      - "plugins/**"
      - "mcp/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing, and --provenance

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    # oidc (default) or op: see the note at the top
    env:
      NPM_AUTH: ${{ vars.NPM_AUTH || 'oidc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: test every package that has a test
        run: |
          for d in plugins/* mcp/*; do
            [ -f "$d/package.json" ] || continue
            [ -d "$d/test" ] && (cd "$d" && node test/e2e.mjs) || true
          done

      # OIDC: npm trusts this workflow for the packages bound to it
      - name: publish with OIDC
        if: env.NPM_AUTH != 'op'
        env:
          STAGE_ON_NEW: ${{ vars.STAGE_ON_NEW || '0' }}
          PROVENANCE: ${{ vars.NPM_PROVENANCE || '1' }}
        run: bash scripts/publish.sh

      # a package npm has never seen: its first version is staged with a token
      - uses: 1password/install-cli-action@v4
        if: env.NPM_AUTH == 'op'
      - name: stage a new package with the 1Password token
        if: env.NPM_AUTH == 'op'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: utvnqpr4yoqgb5vhlenw5mqvaq
          STAGE_ON_NEW: "1"
        run: op run --environment "$OP_ENVIRONMENT_ID" -- bash scripts/publish.sh